<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dos cineastas y medio</title>

  <link rel="stylesheet" href="public/css/main.css">
  <link rel="stylesheet" href="public/css/reproductor.css">

  <style>
  </style>
</head>

<body>
  <div class="title-wrap">
    <p class="subtitle">Luces fuera, el miedo comienza...</p>

    <div class="player-container" id="player-container">
      <div class="video-title" id="video-title">Cargando...</div>

      <!-- Reproductor principal -->
      <video id="player" controls>
        <source id="video-source" src="" type="video/mp4">
          Tu navegador no soporta video HTML5 😢
        </video>

        <!-- Botones -->
        <div style="margin-top:1.5rem;">
          <a href="#" id="mark-viewed" class="mark-btn">Marcar como vista</a>
          <a href="index.html" class="back-btn">Volver a la cartelera</a>
        </div>

        <!-- Sistema de votación -->
        <div class="ratings-container">

          <!-- CINEASTA 1 -->
          <div class="rating-row">

            <label class="subtitle cineasta">
              Cineasta 1:
            </label>

            <!-- Puntuación 1 - 5 -->
            <div class="rating" id="rating1">
              <img src="public/img/calavera.png" data-value="5" alt="5 puntos">
              <img src="public/img/calavera.png" data-value="4" alt="4 puntos">
              <img src="public/img/calavera.png" data-value="3" alt="3 puntos">
              <img src="public/img/calavera.png" data-value="2" alt="2 puntos">
              <img src="public/img/calavera.png" data-value="1" alt="1 punto">
            </div>

          </div>


          <!-- CINEASTA 2 -->
          <div class="rating-row">

            <label class="subtitle cineasta">
              Cineasta 2:
            </label>

            <!-- Puntuación 1 - 5 -->
            <div class="rating" id="rating2">
              <img src="public/img/calavera.png" data-value="5" alt="5 puntos">
              <img src="public/img/calavera.png" data-value="4" alt="4 puntos">
              <img src="public/img/calavera.png" data-value="3" alt="3 puntos">
              <img src="public/img/calavera.png" data-value="2" alt="2 puntos">
              <img src="public/img/calavera.png" data-value="1" alt="1 punto">
            </div>

            <div class="top-container"> 
              <button type="button" id="top1Button" class="top-vote" data-pelicula-id="123">🏆</button>
            </div>

          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="public/js/video.js"></script>
  </body>
  </html>
